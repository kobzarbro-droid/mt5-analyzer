version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5-analyzer-backend
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=5000
      - DEBUG=false
    volumes:
      - ./backend:/app/backend
      - presets_data:/app/presets
    restart: unless-stopped
    networks:
      - mt5-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service with nginx
  frontend:
    image: nginx:alpine
    container_name: mt5-analyzer-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mt5-network

networks:
  mt5-network:
    driver: bridge

volumes:
  presets_data:
